<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>OpenMasjid Display</title>
    <style>
      /* A wall, not a web page: no scrollbars, no text selection, no tap highlight, and a
         black ground so a slow first paint reads as "off" rather than as a broken page. */
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      body { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; cursor: none; }
      #screen { position: fixed; inset: 0; }
      #screen svg { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="screen"></div>
    <script type="module" src="/src/screen.tsx"></script>
  </body>
</html>
