name: Build image

# Builds this app's Dockerfile multi-arch (amd64 + arm64) and pushes to GHCR as
#   ghcr.io/<owner>/<repo-name>:<manifest version>   (+ :latest)
# The owner is taken from the repo (lowercased), so under the OpenMasjid-Solutions
# org the image is
#   ghcr.io/openmasjid-solutions/openmasjiddisplay
# which is what docker-compose.yml references.
#
# After the first run, make the GHCR package Public (owner -> Packages -> package
# settings) so masjid hosts can pull it without authentication.

on:
  push:
    branches: [main]
    tags: ['v*']
    # Docs-only changes don't change the image — skip the (slow) multi-arch build.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'screenshots/**'
      - 'LICENSE'
      - 'docker-compose.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs, not mutable tags. This job holds
      # `packages: write` and publishes the image EVERY MASJID INSTALLS, so a moved tag on
      # any action used here would be a direct supply-chain route into production. Keep the
      # version in the trailing comment when bumping. Same convention as cla.yml in this
      # repo and OpenMasjidAPPS/.github/workflows/build-catalog.yml. (DISPLAY-004)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve image name + version
        id: meta
        run: |
          ver=$(grep -E '^version:' manifest.yaml | head -1 | sed -E 's/^version:[[:space:]]*//' | tr -d "\"' \r")
          [ -n "$ver" ] || ver=latest
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "name=$(echo "${GITHUB_REPOSITORY##*/}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ steps.meta.outputs.name }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ steps.meta.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Optional: tell the OpenMasjidAPPS catalog to rebuild after a release.
      # Requires a repo secret CATALOG_DISPATCH_TOKEN (a PAT with 'repo' scope).
      # - name: Notify catalog
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   env:
      #     GH_TOKEN: ${{ secrets.CATALOG_DISPATCH_TOKEN }}
      #   run: gh api repos/OpenMasjid-Solutions/OpenMasjidAPPS/dispatches -f event_type=rebuild-catalog
