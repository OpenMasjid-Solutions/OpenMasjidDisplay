name: Build image

# Builds this app's Dockerfile multi-arch (amd64 + arm64) and pushes to GHCR as
#   ghcr.io/<owner>/<repo-name>:<manifest version>   (+ :latest)
# The owner is taken from the repo (lowercased), so under the OpenMasjid-Solutions
# org the image is
#   ghcr.io/openmasjid-solutions/openmasjiddisplay
# which is what docker-compose.yml references.
#
# After the first run, make the GHCR package Public (owner -> Packages -> package
# settings) so masjid hosts can pull it without authentication.

on:
  push:
    branches: [main]
    tags: ['v*']
    # Docs-only changes don't change the image — skip the (slow) multi-arch build.
    # `node/` and `image/` are the Raspberry Pi node card, built by image.yml and not part
    # of this container at all. `packages/` is deliberately NOT here: the server compiles
    # render-core and protocol into its own program, so a change there does change the image.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'screenshots/**'
      - 'LICENSE'
      - 'docker-compose.yml'
      - 'node/**'
      - 'image/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name + version
        id: meta
        run: |
          ver=$(grep -E '^version:' manifest.yaml | head -1 | sed -E 's/^version:[[:space:]]*//' | tr -d "\"' \r")
          [ -n "$ver" ] || ver=latest
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "name=$(echo "${GITHUB_REPOSITORY##*/}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ steps.meta.outputs.name }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/${{ steps.meta.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # BOOT the image we just published, do not just build it. Building only proves the
      # Dockerfile parses and the layers assemble; it says nothing about whether the app
      # starts. That distinction became real when tsconfig's rootDir was widened to compile
      # the shared packages, which moved the entrypoint from dist/index.js to
      # dist/server/src/index.js and shifted every __dirname-relative path with it. A masjid
      # finding that out on update is not acceptable, and there is no local Docker on the
      # dev box to catch it beforehand.
      - name: Smoke-test the published image
        run: |
          IMG=ghcr.io/${{ steps.meta.outputs.owner }}/${{ steps.meta.outputs.name }}:${{ steps.meta.outputs.version }}
          docker run -d --name omd-smoke -p 18099:8080 -e MEDIAMTX_MANAGED=no "$IMG"
          for i in $(seq 1 45); do
            curl -fsS -m 2 http://127.0.0.1:18099/healthz >/dev/null 2>&1 && break
            sleep 2
          done
          echo "--- container log ---"
          docker logs omd-smoke 2>&1 | tail -20
          health=$(curl -fsS -m 5 http://127.0.0.1:18099/healthz) || { echo "FAILED: /healthz never answered"; docker rm -f omd-smoke; exit 1; }
          echo "healthz: $health"
          # The control panel must actually be served — that is PUBLIC_DIR resolving to the
          # web bundle, which is the path most likely to break with the new dist depth.
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 http://127.0.0.1:18099/)
          echo "GET / -> $code"
          # And the API must be gated, not merely present.
          api=$(curl -s -o /dev/null -w '%{http_code}' -m 5 http://127.0.0.1:18099/api/state)
          echo "GET /api/state -> $api"
          docker rm -f omd-smoke
          echo "$health" | grep -q '"ok":true' || { echo "FAILED: bad healthz body"; exit 1; }
          [ "$code" = "200" ] || { echo "FAILED: the control panel was not served (PUBLIC_DIR?)"; exit 1; }
          [ "$api" = "401" ] || { echo "FAILED: /api/state should be 401 unauthenticated, got $api"; exit 1; }

      # Optional: tell the OpenMasjidAPPS catalog to rebuild after a release.
      # Requires a repo secret CATALOG_DISPATCH_TOKEN (a PAT with 'repo' scope).
      # - name: Notify catalog
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   env:
      #     GH_TOKEN: ${{ secrets.CATALOG_DISPATCH_TOKEN }}
      #   run: gh api repos/OpenMasjid-Solutions/OpenMasjidAPPS/dispatches -f event_type=rebuild-catalog
