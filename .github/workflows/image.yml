#
# Builds the Raspberry Pi node card (openmasjid-node-vX.Y.Z.img.xz) and attaches it to the
# release for that tag. The panel's "Add screen → Pi node" flow links the latest release, so
# until this workflow has run for a tag there is no image for an admin to download.
#
# pi-gen needs a Debian-family host and root, which is why this is a separate workflow from
# build-image.yml rather than a step in it.
name: Build node image

on:
  push:
    tags: ['v*']
  # Buildable on demand too, so the image can be exercised without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-latest
    # pi-gen on a Zero 2 W target takes a while; the default 6h is plenty but be explicit.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Build the agent and the kiosk on the x86 runner. The agent is TypeScript compiled to
      # plain CommonJS with no native modules, so its output is architecture-independent and
      # needs no arm64 npm install inside the chroot.
      # The agent's end-to-end test drives the REAL controller hub (node/agent's
      # agent.test.ts imports server/src/nodeHub.ts), and its tests-included typecheck
      # therefore compiles part of server/. That needs the server's dependencies — `ws` and
      # `@resvg/resvg-js` — so they get installed here even though nothing from server/ ends
      # up on the card. Testing the agent against the real controller instead of a mock is
      # worth this coupling; without it the typecheck fails on unresolved modules.
      - name: Install the controller's dependencies (needed by the agent's tests)
        working-directory: server
        run: npm ci

      - name: Build the agent
        working-directory: node/agent
        run: |
          npm ci
          npm run build
          npm test

      # Boot the BUILT entry point, not just the sources. tsc's rootDir spans the repo, so
      # dist/ is deeper than src/ and anything resolving paths relative to __dirname behaves
      # differently there — exactly how a `require('../../package.json')` for the version
      # string once made the agent crash on boot with every unit test still passing.
      - name: Smoke-test the built agent
        working-directory: node/agent
        run: |
          mkdir -p /tmp/omd-smoke
          OMD_DATA_DIR=/tmp/omd-smoke OMD_KIOSK_DIR=/tmp/omd-smoke OMD_PORT=18120 \
          OMD_COG_BIN=/bin/true OMD_GST_BIN=/bin/true \
            node dist/node/agent/src/index.js & pid=$!
          for i in $(seq 1 30); do
            curl -fsS -m 1 http://127.0.0.1:18120/api/status >/dev/null 2>&1 && break
            sleep 1
          done
          status=$(curl -fsS -m 3 http://127.0.0.1:18120/api/status)
          echo "$status"
          kill "$pid" 2>/dev/null || true
          # The version must resolve to the real one, not the 0.0.0 fallback.
          echo "$status" | grep -q '"fw":"[1-90-9]*\.[0-9]*\.[0-9]*"' || { echo "bad or missing fw version"; exit 1; }
          echo "$status" | grep -q '"fw":"0.0.0"' && { echo "the version fell back to 0.0.0"; exit 1; }
          echo "$status" | grep -q '"adopted":false' || { echo "a fresh agent must report adopted:false"; exit 1; }

      - name: Build the kiosk
        working-directory: node/kiosk
        run: |
          npm ci
          npm run build

      # Production dependencies only, for what gets copied onto the card.
      - name: Prune the agent to production dependencies
        working-directory: node/agent
        run: npm prune --omit=dev

      - name: Resolve the version
        id: meta
        run: |
          ver=$(grep -E '^version:' manifest.yaml | head -1 | sed -E 's/^version:[[:space:]]*//' | tr -d "\"' \r")
          [ -n "$ver" ] || ver=0.0.0
          echo "version=$ver" >> "$GITHUB_OUTPUT"

      - name: Install pi-gen dependencies
        run: |
          sudo apt-get update
          # pi-gen's dependency check wants qemu-user-binfmt: it needs the binfmt_misc
          # registration to execute arm64 binaries inside the chroot on an amd64 runner, and
          # binfmt-support provides the update-binfmts machinery it hooks into.
          #
          # qemu-user-static is deliberately NOT here — the two packages Conflict with each
          # other (they register the same interpreters), so asking for both leaves apt with
          # "held broken packages".
          sudo apt-get install -y --no-install-recommends \
            coreutils quilt parted debootstrap zerofree zip dosfstools \
            libarchive-tools libcap2-bin grep rsync xz-utils file git curl bc gpg pigz \
            kpartx arch-test binfmt-support qemu-user-binfmt
          # Installing the package is not enough: debootstrap dies with "Unable to execute
          # target architecture" unless the aarch64 interpreter is actually REGISTERED with
          # the running kernel's binfmt_misc. pi-gen's own pre-flight check passes without
          # this because it only tests that qemu can run a binary, not that the chroot can.
          sudo update-binfmts --enable qemu-aarch64
          sudo systemctl restart systemd-binfmt || true
          update-binfmts --display qemu-aarch64 | head -5

      - name: Check out pi-gen
        # master, not the `arm64` branch: that branch is legacy and warns "RELEASE does not
        # match the intended option for this branch", while current master takes ARCH=arm64
        # with RELEASE=bookworm directly.
        run: git clone --depth 1 https://github.com/RPi-Distro/pi-gen.git

      - name: Configure the build
        run: |
          cp -r image/pi-gen/stage-omd pi-gen/
          # Lite is stage2; skip the desktop stages entirely.
          touch pi-gen/stage3/SKIP pi-gen/stage4/SKIP pi-gen/stage5/SKIP
          touch pi-gen/stage4/SKIP_IMAGES pi-gen/stage5/SKIP_IMAGES

          # pi-gen refuses DISABLE_FIRST_BOOT_USER_RENAME without a password, and it is
          # right to: a passwordless account on a device sitting on a masjid's network is a
          # hole. But a FIXED password baked into a published image is worse — it would be
          # the same on every node, forever, and discoverable from this file.
          #
          # So: a fresh random password per build, masked out of the logs, never published,
          # and never needed — the agent runs as its own system user, SSH ships disabled,
          # and stage-omd LOCKS this account outright. It exists only to satisfy pi-gen.
          FIRST_USER_PASS="$(openssl rand -base64 32)"
          echo "::add-mask::$FIRST_USER_PASS"
          cat > pi-gen/config <<EOF
          IMG_NAME=openmasjid-node
          RELEASE=bookworm
          ARCH=arm64
          TARGET_HOSTNAME=omd-node
          FIRST_USER_NAME=omd-setup
          FIRST_USER_PASS=${FIRST_USER_PASS}
          DISABLE_FIRST_BOOT_USER_RENAME=1
          ENABLE_SSH=0
          LOCALE_DEFAULT=en_GB.UTF-8
          KEYBOARD_LAYOUT=gb
          TIMEZONE_DEFAULT=Etc/UTC
          EXPORT_NOOBS=0
          EOF

      - name: Build the image
        working-directory: pi-gen
        env:
          AGENT_DIST: ${{ github.workspace }}/node/agent
          KIOSK_DIST: ${{ github.workspace }}/node/kiosk/dist
        # AGENT_DIST/KIOSK_DIST are consumed by stage-omd/01-run.sh; -E preserves them
        # through sudo into the build.
        run: sudo -E ./build.sh

      - name: Name the artifact
        id: art
        run: |
          img=$(find pi-gen/deploy -name '*.img.xz' | head -1)
          [ -n "$img" ] || { echo "no image produced"; exit 1; }
          out="openmasjid-node-v${{ steps.meta.outputs.version }}.img.xz"
          mv "$img" "$out"
          sha256sum "$out" > "$out.sha256"
          echo "img=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.art.outputs.img }}
          path: |
            ${{ steps.art.outputs.img }}
            ${{ steps.art.outputs.img }}.sha256
          retention-days: 14

      # Attach to the release for a tag build, which is what the panel links to.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "Raspberry Pi node image for ${GITHUB_REF_NAME}."
          gh release upload "${GITHUB_REF_NAME}" \
            "${{ steps.art.outputs.img }}" "${{ steps.art.outputs.img }}.sha256" --clobber
