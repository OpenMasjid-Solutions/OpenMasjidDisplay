<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OpenMasjid Display</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      /* A TV, not a document: no scrollbars, no margins, no text selection, and a black
         backdrop so any letterboxing from a non-16:9 panel disappears into the bezel. */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      body {
        cursor: none;
        user-select: none;
        -webkit-user-select: none;
      }
      /* The SVG carries its own viewBox, so `contain` scales it to the panel with no
         distortion whatever resolution the TV actually negotiated. */
      #screen,
      #screen > svg {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      #screen > svg {
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <div id="screen"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
